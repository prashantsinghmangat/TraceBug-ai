<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TraceBug — confirm send</title>
  <!-- Extension page: CSP is script-src 'self', so all script is external.
       Every value rendered here comes from the PAGE under test. It is written
       with textContent only, never innerHTML — see confirm-send.js. -->
  <style>
    :root {
      --bg: #0B0D14;
      --panel: #141823;
      --text: #EEF0F5;
      --muted: #A8AEBE;
      --line: #252A38;
      --accent: #FF5C6C;
      --warn: #E0A040;
      --danger: #F05257;
    }
    * { box-sizing: border-box; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }
    h1 { font-size: 15px; margin: 0 0 8px; }
    .origin {
      font: 12px/1.4 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      color: var(--muted);
      word-break: break-all;
    }
    .origin b { color: var(--text); font-weight: 600; }
    main { flex: 1 1 auto; overflow-y: auto; padding: 14px 18px; }
    .meta {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 6px 12px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .meta[hidden] { display: none; }
    .meta dt { color: var(--muted); }
    .meta dd { margin: 0; word-break: break-word; }
    .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
    .title-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font-weight: 600;
      word-break: break-word;
    }
    /* The body is shown in FULL — scrollable, never truncated. A user asked to
       approve a send has to be able to read everything that will leave. */
    .body-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: 12px/1.55 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 320px;
      overflow-y: auto;
      margin: 0;
    }
    .warn {
      border: 1px solid rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.08);
      color: #FDE68A;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .warn ul { margin: 6px 0 0; padding-left: 18px; }
    .warn li { margin: 3px 0; }
    footer {
      flex: 0 0 auto;
      padding: 12px 18px 16px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .grow { flex: 1 1 auto; }
    button {
      padding: 9px 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font: 600 13px "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--accent);
      color: #0B0D14;
    }
    button.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid #333A4D;
    }
    button:disabled { opacity: .5; cursor: default; }
    .countdown { font-size: 11px; color: var(--muted); }
    .fatal { padding: 24px 18px; color: var(--muted); font-size: 13px; }

    /* ── Create panel (ADR 010): tracker, repo/team, fields ───────────── */
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .panel[hidden], .panel [hidden] { display: none !important; }
    .prow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .prow + .prow, .pblock { margin-top: 10px; }
    .plabel { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    select, input[type="text"], input[type="search"] {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 9px;
      font: inherit;
      font-size: 13px;
      min-width: 0;
    }
    #container { width: 100%; }
    .muted { color: var(--muted); font-size: 12px; }
    .code {
      font: 600 18px/1.2 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      letter-spacing: .12em;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 10px;
    }
    .code.big { font-size: 30px; padding: 8px 14px; letter-spacing: .14em; user-select: all; }
    fieldset { border: 0; padding: 0; margin: 10px 0 0; min-width: 0; }
    legend { font-size: 12px; color: var(--muted); padding: 0; margin-bottom: 4px; }
    .opts {
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 8px;
      background: var(--bg);
    }
    .opts label { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; cursor: pointer; }
    .opts .filter { width: 100%; margin: 4px 0 6px; }
    .msg { font-size: 12px; margin: 8px 0 0; min-height: 1em; }
    .msg.err { color: var(--danger); }
    a { color: var(--accent); }
    button.small { padding: 6px 12px; font-size: 12px; }
    /* Labels as chips: tick by clicking, filter by typing. */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 132px; overflow-y: auto; padding: 2px; }
    .chips .filter { flex: 1 0 100%; margin-bottom: 2px; }
    button.chip {
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 500;
      font-size: 12px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
    }
    button.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0B0D14; }
    .done { font-size: 15px; font-weight: 600; margin: 4px 0; }

    /* Light theme. The window follows the OS: it has no page to inherit from. */
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #FFFFFF;
        --panel: #F5F6F9;
        --text: #141823;
        --muted: #5B6275;
        --line: #DCE0E8;
        --accent: #D93A4C;
        --warn: #9A6200;
        --danger: #C62834;
      }
      .warn { color: #6B4A00; background: rgba(245, 158, 11, 0.12); }
      button { color: #FFFFFF; }
      button.ghost { color: var(--text); border-color: var(--line); }
      button.chip { color: var(--text); }
      button.chip[aria-pressed="true"] { color: #FFFFFF; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="heading">Send this report?</h1>
    <div class="origin">Requested by <b id="origin">—</b></div>
  </header>

  <main id="main">
    <!-- ADR 010: the Create panel. Shown only for a tracker send. Everything in
         it comes from the worker (tracker, repo and label names) or the user;
         it is still written with textContent only. -->
    <section class="panel" id="panel" hidden aria-label="Where to file the issue">
      <div class="prow">
        <label for="tracker" class="muted">Create in</label>
        <select id="tracker"></select>
        <span class="muted" id="account"></span>
        <span class="grow"></span>
        <button type="button" class="ghost small" id="disconnect" hidden>Disconnect</button>
      </div>

      <div class="pblock" id="connectBox" hidden>
        <p class="muted" id="connectText"></p>
        <div class="prow">
          <button type="button" class="small" id="connect">Connect</button>
          <a href="#" id="settingsLink">Use a token in TraceBug settings</a>
        </div>
        <div class="pblock" id="deviceBox" hidden>
          <span class="plabel" id="deviceHint"></span>
          <div class="prow">
            <span class="code big" id="userCode"></span>
            <button type="button" class="ghost small" id="copyCode">Copy</button>
            <button type="button" class="ghost small" id="openDevice" hidden>Reopen GitHub</button>
          </div>
        </div>
      </div>

      <div class="pblock" id="accessBox" hidden>
        <p class="muted" id="accessText"></p>
        <button type="button" class="small" id="allowAccess">Allow access</button>
      </div>

      <div class="pblock" id="pickBox" hidden>
        <label class="plabel" for="container" id="containerLabel">Repository</label>
        <input type="text" id="container" list="containerList" autocomplete="off" spellcheck="false" />
        <datalist id="containerList"></datalist>
        <a href="#" class="muted" id="manageLink" hidden>Don't see it? Add repositories to TraceBug on GitHub</a>
        <div id="fields"></div>
        <p class="muted" id="attachNote" hidden></p>
      </div>

      <!-- After Create: the result, in place. Nothing opens unless the link is clicked. -->
      <div class="pblock" id="doneBox" hidden>
        <p class="done">✓ Created <a href="#" id="issueLink"></a></p>
        <p class="muted" id="doneNote"></p>
      </div>

      <p class="msg" id="panelMsg" role="status" aria-live="polite"></p>
    </section>

    <div class="warn" id="warnBox" style="display:none">
      <strong>Before you send</strong>
      <ul id="warnList"></ul>
    </div>

    <dl class="meta" id="meta">
      <dt>Destination</dt><dd id="destination">—</dd>
      <dt>Via</dt><dd id="provider">—</dd>
    </dl>

    <div id="titleWrap">
      <div class="label">Title</div>
      <div class="title-box" id="title"></div>
    </div>

    <div class="label" id="bodyLabel">Body</div>
    <pre class="body-box" id="body"></pre>
  </main>

  <footer>
    <span class="countdown" id="countdown"></span>
    <span class="grow"></span>
    <button class="ghost" id="cancel">Cancel</button>
    <button id="send">Send</button>
  </footer>

  <script src="panel-fields.js"></script>
  <script src="confirm-send.js"></script>
</body>
</html>
