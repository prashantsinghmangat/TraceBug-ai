name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Version consistency
        run: npm run check:versions
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build SDK
        run: npm run build
      - name: Check bundle sizes
        run: |
          ESM_SIZE=$(wc -c < dist/index.js)
          CJS_SIZE=$(wc -c < dist/index.cjs)
          IIFE_SIZE=$(wc -c < tracebug-extension/tracebug-sdk.js)
          echo "=== Bundle Sizes ==="
          echo "ESM:  $ESM_SIZE bytes ($(($ESM_SIZE / 1024)) KB)"
          echo "CJS:  $CJS_SIZE bytes ($(($CJS_SIZE / 1024)) KB)"
          echo "IIFE: $IIFE_SIZE bytes ($(($IIFE_SIZE / 1024)) KB)"
          if [ $ESM_SIZE -gt 300000 ]; then
            echo "::warning::ESM bundle exceeds 300KB ($ESM_SIZE bytes)"
          fi

  e2e:
    # Browser-driven checks against the real built SDK. The first three run
    # against website/public/tracebug-sdk.js; the last loads the real unpacked
    # extension, which works headless in Chromium's NEW headless mode (the old
    # one ignored extensions, which is why these used to be local-only).
    # Bundled Chromium only - branded Chrome 137+ silently drops
    # --load-extension, so a run there would pass by testing nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Build extension bundle (produces website/public/tracebug-sdk.js)
        run: npm run build:ext
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E — blur tracking
        run: node e2e/blur-tracking.e2e.mjs
      - name: E2E — pre-record flow
        run: node e2e/pre-record.e2e.mjs
      - name: E2E — inspect mode
        run: node e2e/inspect-mode.e2e.mjs
      - name: E2E — the 1.11 shipping path, for an updater
        # Seeds the video:true an updater was given, then proves the capture is
        # still events-only and no offscreen document appears. The guarantee
        # the unit tests cannot make.
        run: node e2e/ext-shipping-path.e2e.mjs
      - name: E2E — no secret reaches the page (Phase 2a guarantee)
        # The unit test proves the SDK's getters refuse to return a secret.
        # This proves the DOM is clean, which is where the leak actually was.
        run: node e2e/ext-no-secrets-in-page.e2e.mjs
